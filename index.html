                  rows="3"
                  value={userBio}
                  onChange={(e) => setUserBio(e.target.value)}
                  className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs outline-none focus:ring-2 focus:ring-primary/20 resize-none"
                ></textarea>
              </div>

              <div className="flex gap-2 pt-2">
                <Button outline onClick={() => setEditProfileModalOpen(false)} className="flex-1 text-xs">
                  Cancel
                </Button>
                <Button primary type="submit" className="flex-1 text-xs" icon="check">
                  Save Changes
                </Button>
              </div>
            </form>
          </Modal>

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
